{% block content %}
{% load static %}

<div class="navbar-bg"></div>
<nav class="navbar navbar-expand-lg main-navbar">
  <form class="form-inline mr-auto">
    <ul class="navbar-nav mr-3">
      <li><a href="#" data-toggle="sidebar" class="nav-link nav-link-lg"><i class="fas fa-bars"></i></a></li>
      <li><a href="#" data-toggle="search" class="nav-link nav-link-lg d-sm-none"><i class="fas fa-search"></i></a></li>
    </ul>
    <div class="search-element">
      <input class="form-control" type="search" placeholder="Pencarian sistem..." aria-label="Search" data-width="250">
      <button class="btn" type="submit"><i class="fas fa-search"></i></button>
      <div class="search-backdrop"></div>
    </div>
  </form>
  <ul class="navbar-nav navbar-right">
    <li class="dropdown dropdown-list-toggle">
      <a href="#" class="nav-link nav-link-lg message-toggle" style="cursor: default;">
        <span class="tech-pulse-dot"></span>
        <i class="fas fa-calendar-check"></i>
        <span>Posting Aktif</span>
      </a>
    </li>
    <li class="dropdown dropdown-list-toggle">
      <a href="#" class="nav-link nav-link-lg message-toggle" style="cursor: default;">
        <i class="fas fa-clock"></i>
        <span>TA: <strong>{{ tahun }}</strong> &bull; Jadwal: <strong>{{ jadwal_ket|default:"Induk" }}</strong></span>
      </a>
    </li>
    <li class="dropdown">
      <a href="#" data-toggle="dropdown" class="nav-link dropdown-toggle nav-link-lg nav-link-user">
        <img alt="image" src="{% static 'media/img/avatar/avatar-1.png' %}" class="rounded-circle mr-1">
        <div class="d-sm-none d-lg-inline-block font-weight-bold">{{ user_nama }}</div>
      </a>
      <div class="dropdown-menu dropdown-list dropdown-menu-right">
        <div class="dropdown-header">
          Super User
          <div class="float-right">{{ is_superuser }}</div>
        </div>
        <div class="dropdown-header mt-0">
          OPD
          <div class="float-right">{{ subopd }}</div>
        </div>
        <div class="dropdown-header">
          Level
          <div class="float-right">{{ level }}</div>
        </div>
        <div class="dropdown-divider"></div>
        <a href="{% url 'logout' %}" class="dropdown-item has-icon text-danger">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </li>
  </ul>
</nav>
{% endblock content %}
